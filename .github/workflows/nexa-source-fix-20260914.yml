name: NEXA-MF direct source fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/nexa-source-fix-20260914.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce Deferral fail-closed persistence
        run: python3 scripts/fix_deferral_fail_closed_20260915.py
      - name: Validate and commit
        run: |
          git config user.name "nexa-mf-fix-bot"
          git config user.email "nexa-mf-fix-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Require backend persistence for deferrals"
          git push origin HEAD:main
