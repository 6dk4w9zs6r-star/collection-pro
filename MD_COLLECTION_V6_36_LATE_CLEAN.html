<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MD-COLLECTION V6.36</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#07111f}
#status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07111f;color:#fff;font-family:Arial,Tahoma,sans-serif;z-index:10}
#status .box{padding:24px;border:1px solid #334b68;border-radius:18px;background:#101d2e;text-align:center}
#status b{color:#e0bf63;font-size:24px}
</style>
</head>
<body>
<div id="status"><div class="box"><b>MD-COLLECTION V6.36</b><div style="margin-top:10px">جاري التحميل…</div></div></div>
<iframe id="app" src="./MD_COLLECTION_V6_34_SECURE_SEARCH_FIX.html?v=636" title="MD-COLLECTION"></iframe>
<script>
(function(){
  const frame=document.getElementById('app');
  const status=document.getElementById('status');
  function clean(doc){
    if(!doc||!doc.body)return;
    doc.body.querySelectorAll('*').forEach(el=>{
      if(el.children.length===0){
        const t=(el.textContent||'').replace(/\s+/g,' ').trim();
        if((/108\s*عميل/.test(t)&&/Late/i.test(t))||/المعتمد\s*حالياً?[:：]?\s*آخر\s*4\s*ملفات\s*Late/i.test(t)) el.style.display='none';
      }
    });
  }
  frame.addEventListener('load',()=>{
    status.style.display='none';
    try{
      const doc=frame.contentDocument;
      clean(doc);
      new MutationObserver(()=>clean(doc)).observe(doc.documentElement,{childList:true,subtree:true,characterData:true});
      doc.title='MD-COLLECTION V6.36';
    }catch(e){console.error(e)}
  });
})();
</script>
</body>
</html>
