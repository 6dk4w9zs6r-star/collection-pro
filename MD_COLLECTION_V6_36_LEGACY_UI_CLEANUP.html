<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MD-COLLECTION V6.36</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f}
#app{width:100%;height:100%;border:0;display:block;background:#07111f}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07111f;color:#e0bf63;font-family:Arial,Tahoma,sans-serif;font-size:22px;z-index:2}
</style>
</head>
<body>
<div id="loading">MD-COLLECTION V6.36</div>
<iframe id="app" src="./MD_COLLECTION_V6_34_SECURE_SEARCH_FIX.html?v=636" title="MD-COLLECTION"></iframe>
<script>
(function(){
  const frame=document.getElementById('app');
  const loading=document.getElementById('loading');

  function clean(doc){
    if(!doc || !doc.body) return;

    doc.querySelectorAll('button,a,[role="button"]').forEach(el=>{
      const t=(el.innerText||el.textContent||'').replace(/\s+/g,' ').trim();
      if(t.includes('استعادة آخر 4 Late') || t.includes('استعادة Due اليوم')){
        el.style.display='none';
      }
    });

    doc.querySelectorAll('p,small,span,div').forEach(el=>{
      if(el.childElementCount!==0) return;
      const t=(el.innerText||el.textContent||'').replace(/\s+/g,' ').trim();
      if(t.includes('108 عميل') || (t.includes('آخر 4 ملفات Late') && t.includes('المعتمد'))){
        el.style.display='none';
      }
    });
  }

  frame.addEventListener('load',()=>{
    loading.style.display='none';
    try{
      const doc=frame.contentDocument;
      clean(doc);
      const observer=new MutationObserver(()=>clean(doc));
      observer.observe(doc.documentElement,{childList:true,subtree:true,characterData:true});
    }catch(e){
      loading.style.display='flex';
      loading.textContent='تعذر تحميل V6.36';
    }
  });
})();
</script>
</body>
</html>
