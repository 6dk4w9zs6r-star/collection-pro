<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Collection Pro</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}

.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:90px}

header{padding:26px 18px 17px;background:#0b1728;border-bottom:1px solid #24324a}

.logo{font-size:29px;font-weight:800;color:#d8b45b}

.sub{color:#9eabbc;margin-top:4px}

.user{margin-top:10px;font-size:14px}

main{padding:16px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.card{background:#142235;border:1px solid #26364d;border-radius:15px;padding:14px}

.card small{color:#9eabbc}

.card strong{display:block;font-size:22px;margin-top:6px;color:#d8b45b}

h2{font-size:19px;margin:22px 0 11px}

.alerts{background:#241d10;border:1px solid #66501c;border-radius:15px;padding:14px;margin-top:14px}

.alert-title{color:#f1cb67;font-weight:800;margin-bottom:8px}

.alert-item{background:#302711;padding:10px;border-radius:9px;margin-top:7px;font-size:14px}

.search{width:100%;padding:14px;border:0;border-radius:12px;background:#142235;color:white;font-size:16px;outline:none}

.client{margin-top:11px;background:#101d2e;border:1px solid #26364d;border-radius:15px;padding:14px}

.client-top{display:flex;justify-content:space-between;gap:8px}

.name{font-weight:800;font-size:17px}

.amount{color:#efc965;font-weight:800}

.info{color:#aab5c5;font-size:14px;margin-top:7px;line-height:1.7}

.badge{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:20px;font-size:12px;background:#493d1c;color:#f4cf70}

.history{margin-top:10px;padding:10px;background:#0a1524;border-radius:10px;font-size:13px;line-height:1.7;color:#cbd4df}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}

button{border:0;border-radius:10px;padding:11px;font-weight:700;cursor:pointer}

.primary{background:#d8b45b;color:#07111f}

.secondary{background:#22324a;color:#fff}

.add{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 32px));padding:15px;background:#d8b45b;color:#07111f;border-radius:14px;font-size:16px}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);padding:16px;align-items:center;justify-content:center;z-index:20}

.modal-box{width:100%;max-width:500px;max-height:90vh;overflow:auto;background:#101d2e;border-radius:18px;padding:18px}

.modal input,.modal select,.modal textarea{width:100%;margin:5px 0;padding:12px;border:1px solid #30415a;border-radius:10px;background:#142235;color:#fff;font-size:15px}

.modal textarea{min-height:75px}

.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}

.empty{text-align:center;color:#8f9bad;padding:25px}

.due{color:#ffcf5c;font-weight:700}

.late{color:#ff7777;font-weight:700}

</style>

</head>

<body>

<div class="app">

<header>

<div class="logo">Collection Pro</div>

<div class="sub">نظام إدارة ومتابعة التحصيل</div>

<div class="user">لوحة المشرف — مشعل عبدالقادر</div>

</header>

<main>

<div class="stats">

<div class="card"><small>إجمالي المتأخرات</small><strong id="total">0 د.أ</strong></div>

<div class="card"><small>عدد العملاء</small><strong id="count">0</strong></div>

<div class="card"><small>وعود الدفع</small><strong id="promises">0</strong></div>

<div class="card"><small>متابعات اليوم</small><strong id="todayCount">0</strong></div>

</div>

<div class="alerts">

<div class="alert-title">🔔 التذكيرات والمتابعات</div>

<div id="alerts"></div>

</div>

<h2>العملاء والمتابعة</h2>

<input class="search" id="search" placeholder="بحث باسم العميل أو رقم الهاتف..." oninput="render()">

<div id="clients"></div>

</main>

<button class="add" onclick="openModal()">＋ إضافة عميل جديد</button>

</div>

<div class="modal" id="modal">

<div class="modal-box">

<h2>إضافة عميل</h2>

<input id="name" placeholder="اسم العميل">

<input id="phone" placeholder="رقم الهاتف">

<div class="row">

<input id="arrears" type="number" placeholder="المتأخرات">

<input id="installment" type="number" placeholder="القسط">

</div>

<input id="guarantor" placeholder="اسم الكفيل">

<input id="guarantorPhone" placeholder="هاتف الكفيل">

<select id="employee">

<option>مشعل عبدالقادر</option>

<option>موظف 1</option>

<option>موظف 2</option>

</select>

<select id="status">

<option value="متابعة">متابعة</option>

<option value="وعد بالدفع">وعد بالدفع</option>

<option value="إنذار نهائي">إنذار نهائي</option>

<option value="قانوني">قانوني</option>

<option value="مسدد">مسدد</option>

</select>

<label>تاريخ المتابعة القادمة</label>

<input id="followup" type="date">

<label>تاريخ وعد السداد</label>

<input id="promiseDate" type="date">

<textarea id="notes" placeholder="ملاحظات"></textarea>

<div class="row">

<button class="primary" onclick="saveClient()">حفظ العميل</button>

<button class="secondary" onclick="closeModal()">إلغاء</button>

</div>

</div>

</div>

<script>

let clients=JSON.parse(localStorage.getItem("collection_clients")||"[]");

function save(){

localStorage.setItem("collection_clients",JSON.stringify(clients));

}

function today(){

return new Date().toISOString().slice(0,10);

}

function tomorrow(){

let d=new Date();

d.setDate(d.getDate()+1);

return d.toISOString().slice(0,10);

}

function money(n){

return Number(n||0).toLocaleString("ar-JO")+" د.أ";

}

function safe(v){

return String(v||"")

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}

function renderAlerts(){

let t=today();

let tm=tomorrow();

let items=[];

clients.forEach(c=>{

if(c.promiseDate===tm){

items.push("غدًا موعد وعد السداد للعميل "+c.name+" — الموظف: "+(c.employee||"-"));

}

if(c.promiseDate===t){

items.push("اليوم موعد وعد السداد للعميل "+c.name+" — الموظف: "+(c.employee||"-"));

}

if(c.followup===t && !c.followedToday){

items.push("متابعة مطلوبة اليوم: "+c.name+" — الموظف: "+(c.employee||"-"));

}

});

document.getElementById("alerts").innerHTML=

items.length

?items.map(x=>'<div class="alert-item">'+safe(x)+'</div>').join("")

:'<div class="empty">لا توجد تذكيرات حالياً</div>';

}

function render(){

let q=document.getElementById("search").value.trim();

let list=clients.filter(c=>

(c.name||"").includes(q)||(c.phone||"").includes(q)

);

document.getElementById("count").textContent=clients.length;

document.getElementById("total").textContent=

money(clients.reduce((s,c)=>s+Number(c.arrears||0),0));

document.getElementById("promises").textContent=

clients.filter(c=>c.promiseDate && c.status!=="مسدد").length;

document.getElementById("todayCount").textContent=

clients.filter(c=>c.followup===today()&&!c.followedToday).length;

let box=document.getElementById("clients");

if(!list.length){

box.innerHTML='<div class="empty">لا يوجد عملاء حالياً</div>';

renderAlerts();

return;

}

box.innerHTML=list.map(c=>`

<div class="client">

<div class="client-top">

<div class="name">${safe(c.name)}</div>

<div class="amount">${money(c.arrears)}</div>

</div>

<div class="info">

الهاتف: ${safe(c.phone||"-")}<br>

القسط: ${money(c.installment)}<br>

الكفيل: ${safe(c.guarantor||"-")}<br>

الموظف المسؤول: ${safe(c.employee||"-")}<br>

المتابعة القادمة: ${safe(c.followup||"-")}<br>

وعد السداد: ${safe(c.promiseDate||"-")}

</div>

<span class="badge">${safe(c.status||"متابعة")}</span>

${c.history&&c.history.length?`

<div class="history">

<b>آخر المتابعات:</b><br>

${c.history.slice(-3).reverse().map(h=>

safe(h.date)+" — "+safe(h.employee)+" — "+safe(h.result)

).join("<br>")}

</div>`:""}

<div class="actions">

<button class="primary" onclick="follow(${c.id})">تسجيل متابعة</button>

<button class="secondary" onclick="removeClient(${c.id})">حذف</button>

</div>

</div>

`).join("");

renderAlerts();

}

function openModal(){

document.getElementById("modal").style.display="flex";

}

function closeModal(){

document.getElementById("modal").style.display="none";

}

function saveClient(){

let name=document.getElementById("name").value.trim();

if(!name){

alert("أدخل اسم العميل");

return;

}

clients.unshift({

id:Date.now(),

name,

phone:document.getElementById("phone").value.trim(),

arrears:Number(document.getElementById("arrears").value||0),

installment:Number(document.getElementById("installment").value||0),

guarantor:document.getElementById("guarantor").value.trim(),

guarantorPhone:document.getElementById("guarantorPhone").value.trim(),

employee:document.getElementById("employee").value,

status:document.getElementById("status").value,

followup:document.getElementById("followup").value,

promiseDate:document.getElementById("promiseDate").value,

notes:document.getElementById("notes").value.trim(),

history:[],

followedToday:false

});

save();

closeModal();

clearForm();

render();

}

function clearForm(){

["name","phone","arrears","installment","guarantor",

"guarantorPhone","followup","promiseDate","notes"]

.forEach(id=>document.getElementById(id).value="");

}

function follow(id){

let c=clients.find(x=>x.id===id);

let result=prompt(

"نتيجة المتابعة:\nمثال: وعد بالدفع / لا يجيب / زيارة / رفض الدفع"

);

if(!result)return;

let next=prompt(

"تاريخ المتابعة القادمة بصيغة YYYY-MM-DD\nاتركها فارغة إذا لا يوجد",

c.followup||""

);

let promise=prompt(

"تاريخ وعد السداد بصيغة YYYY-MM-DD\nاتركها فارغة إذا لا يوجد",

c.promiseDate||""

);

c.history=c.history||[];

c.history.push({

date:new Date().toLocaleString("ar-JO"),

employee:c.employee||"غير محدد",

result

});

c.notes=result;

c.followedToday=true;

if(next!==null)c.followup=next.trim();

if(promise!==null)c.promiseDate=promise.trim();

if(c.promiseDate)c.status="وعد بالدفع";

save();

render();

alert("تم تسجيل المتابعة وحفظها في سجل العميل");

}

function removeClient(id){

if(confirm("هل تريد حذف العميل؟")){

clients=clients.filter(c=>c.id!==id);

save();

render();

}

}

render();

</script>

</body>

</html>
